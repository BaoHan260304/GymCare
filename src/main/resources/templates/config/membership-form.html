<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Tạo Gói Tập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 600px;">
    <h2 th:text="${pageTitle}">Tạo Gói Tập Mới</h2>

    <form th:action="@{/manager/memberships/save}" th:object="${membership}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="membershipName">Tên Gói Tập:</label>
            <input type="text" id="membershipName" th:field="*{membershipName}" required>
        </div>

        <div class="form-group">
            <label for="description">Mô tả:</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="price">Giá (VNĐ):</label>
            <input type="number" id="price" th:field="*{price}" required min="0">
        </div>

        <div class="form-group">
            <label for="durationInDays">Thời hạn (số ngày):</label>
            <input type="number" id="durationInDays" th:field="*{durationInDays}" required min="1">
        </div>

        <div class="form-group">
            <label for="isActive">Trạng thái:</label>
            <select id="isActive" th:field="*{isActive}">
                <option th:value="true">Kích hoạt</option>
                <option th:value="false">Vô hiệu hóa</option>
            </select>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn">Lưu</button>
            <a th:href="@{/manager/memberships}" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
