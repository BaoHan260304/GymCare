<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create account Trainer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>
<div class="container">
    <h2>Create new account for Trainer</h2>

    <form th:action="@{/manager/trainers}" th:object="${trainerRequest}" method="post" class="styled-form">
        <div class="form-row">
            <div class="form-group">
                <label for="userName">Full name:</label>
                <input type="text" id="userName" th:field="*{userName}" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="mobile">Phone number:</label>
                <input type="tel" id="mobile" th:field="*{mobile}">
            </div>
            <div class="form-group">
                <label for="birthday">Date of birth:</label>
                <input type="date" id="birthday" th:field="*{birthday}">
            </div>
        </div>
        <div class="form-group">
            <label for="identityCard">Identity card:</label>
            <input type="text" id="identityCard" th:field="*{identityCard}">
        </div>
        <hr>
        <h4>Professional information</h4>
        <div class="form-row">
            <div class="form-group">
                <label for="licenceNumber">Licence Number:</label>
                <input type="text" id="licenceNumber" th:field="*{licenceNumber}">
            </div>
            <div class="form-group">
                <label for="licenceDate">Licence Date:</label>
                <input type="date" id="licenceDate" th:field="*{licenceDate}">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Create account</button>
            <a th:href="@{/manager/trainers}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
