<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Edit User: <span th:text="${users.userName}"></span></h2>

    <form th:action="@{/admin/users/update/{id}(id=${users.id})}" th:object="${users}" method="post"
          class="styled-form">
        <div class="form-group">
            <label for="userName">Full name:</label>
            <input type="text" id="userName" th:field="*{userName}" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{account.email}" readonly>
            <small>Email can't be changed.</small>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile:</label>
            <input type="tel" id="mobile" th:field="*{mobile}">
        </div>
        <div class="form-group">
            <label for="birthday">Date of birth:</label>
            <input type="date" id="birthday" th:field="*{birthday}">
        </div>
        <div class="form-group">
            <label for="identityCard">Identity card:</label>
            <input type="text" id="identityCard" th:field="*{identityCard}">
        </div>
        <div class="form-group">
            <label for="role">Role:</label>
            <input type="text" id="role" th:field="*{account.role}" readonly>
            <small>Role can't be changed here.</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Update</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
